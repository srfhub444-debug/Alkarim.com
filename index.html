<!DOCTYPE html>
<html lang="ur" dir="rtl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>القرآن الكريم - Premium Mushaf & Tafseer Portal</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        emerald: { 850: '#064e3b', 900: '#022c22', 950: '#011910' },
                        gold: { 400: '#fbbf24', 500: '#d97706', 600: '#b45309' }
                    }
                }
            }
        }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Amiri:ital,wght@0,400;0,700;1,400&family=Noto+Nastaliq+Urdu:wght@400..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        .quran-heading { font-family: 'Amiri Quran', 'Amiri', serif !important; line-height: 1.6 !important; display: inline-block; }
        .quran-text { font-family: 'Amiri Quran', 'Amiri', serif !important; line-height: 2.8 !important; }
        .urdu-text { font-family: 'Noto Nastaliq Urdu', serif !important; line-height: 2.3 !important; }
        .ayah-end-num { font-family: 'Amiri Quran', serif; color: #d97706; font-size: 1.25em; margin-right: 8px; margin-left: 8px; display: inline-block; }
        .btn-premium-gold { background: linear-gradient(135deg, #fbbf24 0%, #d97706 100%); box-shadow: 0 4px 15px rgba(217, 119, 6, 0.3); transition: all 0.3s ease; }
        .btn-premium-gold:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(217, 119, 6, 0.5); }
        .btn-premium-emerald { background: linear-gradient(135deg, #059669 0%, #064e3b 100%); box-shadow: 0 4px 15px rgba(5, 150, 105, 0.3); transition: all 0.3s ease; }
        .btn-premium-emerald:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(5, 150, 105, 0.5); }
        .btn-glass-subtle { background: rgba(16, 185, 129, 0.1); border: 1px solid rgba(16, 185, 129, 0.2); transition: all 0.3s ease; }
        .btn-glass-subtle:hover { background: rgba(16, 185, 129, 0.2); transform: translateY(-1px); }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #022c22; }
        ::-webkit-scrollbar-thumb { background: #059669; border-radius: 4px; }

</head>
<body class="bg-slate-50 dark:bg-emerald-950 text-slate-800 dark:text-emerald-100 min-h-screen transition-colors duration-300 flex flex-col font-sans pb-24">

    <!-- Header -->
    <header class="sticky top-0 z-40 bg-white/95 dark:bg-emerald-900/95 backdrop-blur-md border-b-2 border-gold-500/30 shadow-2xl py-3.5">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex items-center justify-between">
            <div class="flex items-center gap-2.5">
                <button id="themeToggleBtn" class="p-2.5 rounded-2xl btn-glass-subtle text-emerald-700 dark:text-gold-400 shadow-sm"><i class="fa-solid fa-moon dark:hidden text-base"></i><i class="fa-solid fa-sun hidden dark:block text-base"></i></button>
                <button id="adminBtn" class="px-4 py-2.5 rounded-2xl btn-premium-gold text-slate-950 text-xs font-extrabold flex items-center gap-1.5 urdu-text"><i class="fa-solid fa-lock text-slate-950"></i> ایڈمن کنورٹر</button>
            </div>
            <div class="text-center flex flex-col items-center py-0.5">
                <div class="flex items-center gap-2 mb-1.5">
                    <span class="text-gold-500 text-lg">۝</span>
                    <i class="fa-solid fa-kaaba text-gold-500 text-lg"></i>
                    <h1 class="quran-heading text-3xl sm:text-4xl font-extrabold bg-gradient-to-r from-gold-600 via-gold-400 to-emerald-500 dark:from-gold-300 dark:via-gold-400 dark:to-emerald-200 bg-clip-text text-transparent px-2">القرآن الكريم</h1>
                    <i class="fa-solid fa-mosque text-gold-500 text-lg"></i>
                    <span class="text-gold-500 text-lg">۝</span>
                </div>
                <p class="text-xs text-emerald-700 dark:text-emerald-300 urdu-text font-semibold tracking-wide">ترجمہ مفتی تقی عثمانی & تفسیر ابن کثیر</p>
            </div>
            <div class="w-11 h-11 rounded-2xl btn-premium-gold flex items-center justify-center text-slate-950 shadow-lg border border-gold-400/50"><i class="fa-solid fa-book-quran text-xl"></i></div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">
        <div class="bg-white dark:bg-emerald-900/60 rounded-3xl p-5 sm:p-6 shadow-xl border border-emerald-100 dark:border-emerald-800/50 mb-6 backdrop-blur-sm">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold text-emerald-700 dark:text-emerald-300 mb-2 urdu-text">سورۃ منتخب کریں (1 تا 114):</label>
                    <select id="surahSelect" class="w-full bg-slate-50 dark:bg-emerald-950/80 border border-emerald-200 dark:border-emerald-700 rounded-2xl px-4 py-3 text-sm outline-none urdu-text shadow-inner"></select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-emerald-700 dark:text-emerald-300 mb-2 urdu-text">معلومات:</label>
                    <div class="w-full bg-slate-100 dark:bg-emerald-950/80 border border-emerald-200 dark:border-emerald-700 rounded-2xl px-4 py-3 text-sm text-emerald-700 dark:text-emerald-300 urdu-text font-semibold flex items-center justify-between shadow-inner">
                        <span>ترجمہ: آسان اردو</span>
                        <span class="text-xs text-gold-500 font-bold">تفسیر: ابن کثیر</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="bg-gradient-to-r from-emerald-900 via-emerald-800 to-emerald-950 text-white rounded-3xl p-6 sm:p-8 mb-8 text-center shadow-2xl relative overflow-hidden border border-gold-500/30">
            <h2 id="headerTitle" class="quran-heading text-4xl sm:text-5xl font-bold text-gold-400 mb-3">لوڈ ہو رہا ہے...</h2>
            <p id="headerSubtitle" class="urdu-text text-sm text-emerald-200">-</p>
        </div>

        <div id="loader" class="text-center py-16">
            <i class="fa-solid fa-spinner fa-spin text-4xl text-gold-500 mb-3"></i>
            <p class="urdu-text text-emerald-600 dark:text-emerald-400 text-sm">قرآن پاک کا ڈیٹا لوڈ ہو رہا ہے...</p>
        </div>

        <div id="ayahContainer" class="space-y-6"></div>
    </main>

    <!-- Tafseer Modal -->
    <div id="tafseerModal" class="fixed inset-0 z-50 hidden bg-black/80 backdrop-blur-md flex items-center justify-center p-4">
        <div class="bg-white dark:bg-emerald-900 rounded-3xl max-w-2xl w-full max-h-[85vh] flex flex-col shadow-2xl border border-gold-500/50 overflow-hidden">
            <div class="p-4 sm:p-5 border-b border-emerald-200 dark:border-emerald-800 flex justify-between items-center bg-emerald-50 dark:bg-emerald-950">
                <h3 id="modalTitle" class="font-bold text-emerald-800 dark:text-gold-400 text-lg urdu-text">تفسیر ابن کثیر</h3>
                <button id="closeTafseerBtn" class="w-9 h-9 rounded-full bg-slate-200 dark:bg-emerald-800 text-slate-700 dark:text-emerald-200 flex items-center justify-center hover:bg-gold-500 hover:text-slate-950 transition"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <div class="p-6 overflow-y-auto space-y-4 text-right">
                <div id="modalAyahArabic" class="quran-text text-2xl text-emerald-700 dark:text-emerald-300 p-5 bg-emerald-50/50 dark:bg-emerald-950/50 rounded-2xl text-center border border-emerald-100 dark:border-emerald-800 shadow-inner"></div>
                <div id="modalTafseerContent" class="urdu-text text-slate-700 dark:text-emerald-100 text-base leading-loose"></div>
            </div>
        </div>
    </div>

    <!-- Admin Authentication Modal -->
    <div id="adminAuthModal" class="fixed inset-0 z-50 hidden bg-black/80 backdrop-blur-md flex items-center justify-center p-4">
        <div class="bg-white dark:bg-emerald-900 rounded-3xl max-w-md w-full p-6 sm:p-8 shadow-2xl border border-gold-500/50 text-center">
            <h3 class="font-bold text-lg text-emerald-800 dark:text-gold-400 mb-4 urdu-text">ایڈمن پاس ورڈ درج کریں</h3>
            <input type="password" id="adminPasswordInput" placeholder="Password..." class="w-full bg-slate-100 dark:bg-emerald-950 border border-emerald-300 dark:border-emerald-700 rounded-2xl px-4 py-3 mb-5 text-center text-sm outline-none shadow-inner">
            <div class="flex justify-center gap-3">
                <button id="adminLoginSubmit" class="px-6 py-2.5 btn-premium-emerald text-white rounded-2xl text-xs font-bold urdu-text">داخل ہوں</button>
                <button id="adminLoginClose" class="px-6 py-2.5 bg-slate-200 dark:bg-slate-800 text-slate-800 dark:text-white rounded-2xl text-xs font-bold urdu-text">بند کریں</button>
            </div>
        </div>
    </div>

    <!-- Admin Panel Modal -->
    <div id="adminPanelModal" class="fixed inset-0 z-50 hidden bg-black/80 backdrop-blur-md flex items-center justify-center p-4">
        <div class="bg-white dark:bg-emerald-900 rounded-3xl max-w-2xl w-full max-h-[90vh] flex flex-col shadow-2xl border border-gold-500 overflow-hidden">
            <div class="p-4 sm:p-5 border-b border-emerald-200 dark:border-emerald-800 flex justify-between items-center bg-emerald-50 dark:bg-emerald-950">
                <h3 class="font-bold text-emerald-800 dark:text-gold-400 text-lg urdu-text">ایڈمن کنورٹر & کلاؤڈ مینیجر</h3>
                <button id="adminPanelClose" class="w-9 h-9 rounded-full bg-slate-200 dark:bg-emerald-800 text-slate-700 dark:text-emerald-200 flex items-center justify-center hover:bg-gold-500 hover:text-slate-950 transition"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <div class="p-6 overflow-y-auto space-y-4 text-right urdu-text">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold mb-1.5">سورۃ منتخب کریں:</label>
                        <select id="adminSurahSelect" class="w-full bg-slate-100 dark:bg-emerald-950 border border-emerald-300 dark:border-emerald-700 rounded-2xl px-4 py-2.5 text-sm outline-none"></select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold mb-1.5">آیت نمبر:</label>
                        <input type="number" id="adminAyahNum" min="1" max="286" value="1" class="w-full bg-slate-100 dark:bg-emerald-950 border border-emerald-300 dark:border-emerald-700 rounded-2xl px-4 py-2.5 text-sm outline-none">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold mb-1.5">آیت کا اردو ترجمہ (Single Ayah):</label>
                    <textarea id="adminTranslationText" rows="2" class="w-full bg-slate-100 dark:bg-emerald-950 border border-emerald-300 dark:border-emerald-700 rounded-2xl p-3 text-sm outline-none shadow-inner" placeholder="Yahan tarjuma likhein..."></textarea>
                </div>
                <div>
                    <label class="block text-xs font-bold mb-1.5">تفسیر ابن کثیر متن (Single Ayah):</label>
                    <textarea id="adminTafseerText" rows="3" class="w-full bg-slate-100 dark:bg-emerald-950 border border-emerald-300 dark:border-emerald-700 rounded-2xl p-3 text-sm outline-none shadow-inner" placeholder="Yahan tafseer likhein..."></textarea>
                </div>
                <button id="adminPublishBtn" class="w-full py-3 btn-premium-gold text-slate-950 rounded-2xl font-extrabold shadow-lg text-xs">محفوظ کریں (Single Ayah Save)</button>

                <!-- Bulk JSON Upload Box -->
                <div class="mt-6 pt-4 border-t border-emerald-300 dark:border-emerald-800">
                    <label class="block text-xs font-bold mb-1.5 text-gold-400">پوری سورۃ کا ڈیٹا ایک ساتھ اپلوڈ کریں (Bulk JSON Import):</label>
                    <textarea id="adminBulkJsonInput" rows="6" class="w-full bg-slate-100 dark:bg-emerald-950 border border-emerald-300 dark:border-emerald-700 rounded-2xl p-3 text-xs outline-none dir-ltr font-mono" placeholder='{
  "1": { "translation": "شروع اللہ کے نام سے...", "tafseer": "تفسیر..." },
  "2": { "translation": "سب تعریفیں اللہ کے لیے...", "tafseer": "تفسیر..." }
}'></textarea>
                    <button id="adminBulkSaveBtn" class="w-full mt-2 py-3 btn-premium-emerald text-white rounded-2xl font-bold text-xs shadow-lg">پوری سورۃ کا ڈیٹا یکمشت محفوظ کریں (Bulk Save Entire Surah)</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Direct Sticky Footer -->
    <style>
        #customStickyFooter {
            position: fixed !important; bottom: 0 !important; left: 0 !important; right: 0 !important;
            z-index: 999999 !important; background: #022c22 !important; border-top: 2px solid #d97706 !important;
            box-shadow: 0 -10px 25px rgba(0, 0, 0, 0.5) !important; padding: 8px 10px !important;
            font-family: 'Noto Nastaliq Urdu', serif !important;
        }
        .footer-nav-container { max-width: 700px; margin: 0 auto; display: flex; justify-content: space-around; align-items: center; }
        .footer-nav-item { display: flex; flex-direction: column; align-items: center; color: #d1fae5 !important; text-decoration: none !important; font-size: 11px !important; padding: 4px 8px; border-radius: 12px; cursor: pointer; }
        .footer-nav-item i { font-size: 18px !important; margin-bottom: 2px; color: #fbbf24 !important; }
        .footer-nav-item:hover { color: #fbbf24 !important; background: rgba(217, 119, 6, 0.2); }
    </style>
    <div id="customStickyFooter">
        <nav>
            <div class="footer-nav-container">
                <a href="index.html" class="footer-nav-item"><i class="fa-solid fa-house"></i><span>ہوم</span></a>
                <a href="Features.html#quran" class="footer-nav-item"><i class="fa-solid fa-book-quran"></i><span>القرآن</span></a>
                <a href="Features.html#hadith" class="footer-nav-item"><i class="fa-solid fa-scroll"></i><span>چالیس حدیث</span></a>
                <a href="Features.html#rabbana" class="footer-nav-item"><i class="fa-solid fa-hands-praying"></i><span>چالیس ربنا</span></a>
                <a href="Features.html#about" class="footer-nav-item"><i class="fa-solid fa-circle-info"></i><span>تعارف</span></a>
            </div>
        </nav>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-16 left-1/2 -translate-x-1/2 bg-emerald-900 text-gold-400 px-6 py-3 rounded-2xl text-sm font-semibold shadow-2xl transition-all duration-300 opacity-0 pointer-events-none z-50 border border-gold-500/50 urdu-text backdrop-blur-md">
        <span id="toastMsg">کامیابی سے محفوظ ہو گیا۔</span>
    </div>

    <!-- Script Logic -->
    <script>
        let allSurahsMeta = [];
        let currentAudio = null;

        function toArabicNumber(num) {
            const arabicDigits = ['٠', '١', '٢', '٣', '٤', '٥', '٦', '٧', '٨', '٩'];
            return num.toString().split('').map(d => arabicDigits[d] || d).join('');
        }

        async function initApp() {
            try {
                const res = await fetch('https://api.alquran.cloud/v1/surah');
                const data = await res.json();
                allSurahsMeta = data.data;

                const select = document.getElementById('surahSelect');
                const adminSelect = document.getElementById('adminSurahSelect');
                select.innerHTML = '';
                adminSelect.innerHTML = '';

                allSurahsMeta.forEach(s => {
                    const opt = document.createElement('option');
                    opt.value = s.number;
                    opt.textContent = `${s.number}. ${s.englishName} (${s.name})`;
                    select.appendChild(opt);

                    const optAdmin = opt.cloneNode(true);
                    adminSelect.appendChild(optAdmin);
                });

                loadSurah(1);
            } catch (err) {
                document.getElementById('loader').innerHTML = '<p class="text-red-500 urdu-text">ڈیٹا لوڈ کرنے میں مسئلہ ہوا۔</p>';
            }
        }

        async function loadSurah(surahNum) {
            const loader = document.getElementById('loader');
            const container = document.getElementById('ayahContainer');
            loader.classList.remove('hidden');
            container.innerHTML = '';

            try {
                const [resAr, resUr, resAudio] = await Promise.all([
                    fetch(`https://api.alquran.cloud/v1/surah/${surahNum}`),
                    fetch(`https://api.alquran.cloud/v1/surah/${surahNum}/ur.jalandhry`),
                    fetch(`https://api.alquran.cloud/v1/surah/${surahNum}/ar.alafasy`)
                ]);

                const dataAr = await resAr.json();
                const dataUr = await resUr.json();
                const dataAudio = await resAudio.json();

                loader.classList.add('hidden');
                const meta = allSurahsMeta[surahNum - 1] || { name: 'سورۃ', englishName: '', numberOfAyahs: 0 };
                document.getElementById('headerTitle').innerText = meta.name;
                document.getElementById('headerSubtitle').innerText = `${meta.englishName} • آیات: ${meta.numberOfAyahs}`;

                let customData = JSON.parse(localStorage.getItem(`surah_${surahNum}_data`) || '{}');

                dataAr.data.ayahs.forEach((ayah, index) => {
                    const ayahNum = ayah.numberInSurah;
                    let urduText = dataUr.data && dataUr.data.ayahs[index] ? dataUr.data.ayahs[index].text : "ترجمہ دستیاب نہیں ہے۔";
                    
                    if (customData[ayahNum] && customData[ayahNum].translation) {
                        urduText = customData[ayahNum].translation;
                    }

                    const audioUrl = dataAudio.data && dataAudio.data.ayahs[index] ? dataAudio.data.ayahs[index].audio : '';
                    const arabicNumStr = toArabicNumber(ayahNum);

                    const card = document.createElement('div');
                    card.className = "bg-white dark:bg-emerald-900/65 rounded-3xl p-6 sm:p-8 shadow-xl border border-emerald-100 dark:border-emerald-800/40 hover:shadow-2xl transition duration-300 backdrop-blur-sm";

                    const topRow = document.createElement('div');
                    topRow.className = "flex justify-between items-center mb-5";
                    
                    const badge = document.createElement('span');
                    badge.className = "px-4 py-1.5 rounded-2xl bg-gold-500/20 text-gold-600 dark:text-gold-400 font-bold text-xs border border-gold-500/40 urdu-text shadow-sm";
                    badge.innerText = `آیت نمبر ${ayahNum}`;
                    topRow.appendChild(badge);

                    if (audioUrl) {
                        const audioBtn = document.createElement('button');
                        audioBtn.className = "px-4 py-2 rounded-2xl btn-glass-subtle text-emerald-700 dark:text-gold-400 text-xs font-bold transition flex items-center gap-2 urdu-text shadow-sm";
                        audioBtn.innerHTML = `<i class="fa-solid fa-circle-play text-base text-gold-500"></i> تلاوت سنیں`;
                        audioBtn.onclick = () => {
                            if (currentAudio) currentAudio.pause();
                            currentAudio = new Audio(audioUrl);
                            currentAudio.play();
                            showToast("تلاوت شروع ہو رہی ہے...");
                        };
                        topRow.appendChild(audioBtn);
                    }
                    card.appendChild(topRow);

                    const arabicBox = document.createElement('div');
                    arabicBox.className = "p-5 sm:p-6 rounded-2xl bg-emerald-50/40 dark:bg-emerald-950/40 border border-emerald-100/50 dark:border-emerald-800/30 mb-5 shadow-inner";
                    arabicBox.innerHTML = `
                        <p class="quran-text text-2xl sm:text-3xl text-right text-slate-900 dark:text-emerald-100">
                            ${ayah.text} <span class="ayah-end-num">۝${arabicNumStr}</span>
                        </p>
                    `;
                    card.appendChild(arabicBox);

                    const translationBox = document.createElement('div');
                    translationBox.className = "pt-1 px-1 mb-6";
                    translationBox.innerHTML = `
                        <p class="urdu-text text-base sm:text-lg text-right text-emerald-800 dark:text-emerald-200">
                            <strong class="text-gold-500 text-sm ml-2">[اردو ترجمہ]:</strong>${urduText}
                        </p>
                    `;
                    card.appendChild(translationBox);

                    const actionRow = document.createElement('div');
                    actionRow.className = "pt-4 border-t border-emerald-100 dark:border-emerald-800/50 flex flex-wrap gap-2.5 justify-end";

                    // Tafseer Button Logic
                    const tafseerBtn = document.createElement('button');
                    tafseerBtn.className = "px-4 py-2.5 text-xs font-bold rounded-2xl btn-premium-emerald text-white transition flex items-center gap-2 urdu-text";
                    tafseerBtn.innerHTML = `<i class="fa-solid fa-book-open"></i> تفسیر ابن کثیر`;
                    tafseerBtn.onclick = () => {
                        let customTafseer = customData[ayahNum] && customData[ayahNum].tafseer ? customData[ayahNum].tafseer : `اس آیت مبارکہ کی تفسیر فی الحال ایڈمن کنورٹر سے درج نہیں کی گئی۔`;
                        
                        document.getElementById('modalTitle').innerText = `تفسیر ابن کثیر - ${meta.name} (آیت ${ayahNum})`;
                        document.getElementById('modalAyahArabic').innerText = `${ayah.text} ۝${arabicNumStr}`;
                        document.getElementById('modalTafseerContent').innerHTML = `
                            <div class="mb-3"><strong>اردو ترجمہ:</strong> ${urduText}</div>
                            <hr class="my-3 border-emerald-200 dark:border-emerald-800">
                            <div><strong>تفسیر ابن کثیر:</strong><br>${customTafseer}</div>
                        `;
                        document.getElementById('tafseerModal').classList.remove('hidden');
                    };
                    actionRow.appendChild(tafseerBtn);

                    const copyBtn = document.createElement('button');
                    copyBtn.className = "px-4 py-2.5 text-xs font-semibold rounded-2xl btn-glass-subtle text-emerald-700 dark:text-emerald-200 transition flex items-center gap-1.5 urdu-text";
                    copyBtn.innerHTML = `<i class="fa-regular fa-copy"></i> کاپی`;
                    copyBtn.onclick = () => {
                        navigator.clipboard.writeText(`${ayah.text} ۝${arabicNumStr}\n\nاردو ترجمہ: ${urduText}`);
                        showToast("آیت اور ترجمہ کاپی ہو گیا!");
                    };
                    actionRow.appendChild(copyBtn);

                    const saveBtn = document.createElement('button');
                    saveBtn.className = "px-4 py-2.5 text-xs font-semibold rounded-2xl btn-glass-subtle text-emerald-700 dark:text-emerald-200 transition flex items-center gap-1.5 urdu-text";
                    saveBtn.innerHTML = `<i class="fa-regular fa-bookmark"></i> محفوظ کریں`;
                    saveBtn.onclick = () => {
                        let savedList = JSON.parse(localStorage.getItem('savedAyahs') || '[]');
                        savedList.push({ surah: meta.name, ayah: ayahNum, arabic: ayah.text, urdu: urduText });
                        localStorage.setItem('savedAyahs', JSON.stringify(savedList));
                        showToast("آیت کامیابی سے محفوظ (Bookmark) ہو گئی!");
                    };
                    actionRow.appendChild(saveBtn);

                    const shareBtn = document.createElement('button');
                    shareBtn.className = "px-4 py-2.5 text-xs font-semibold rounded-2xl btn-glass-subtle text-emerald-700 dark:text-emerald-200 transition flex items-center gap-1.5 urdu-text";
                    shareBtn.innerHTML = `<i class="fa-solid fa-share-nodes"></i> شیئر`;
                    shareBtn.onclick = () => {
                        const shareText = `${ayah.text} ۝${arabicNumStr}\n\nاردو ترجمہ: ${urduText}\n\n(القرآن الكريم)`;
                        if (navigator.share) {
                            navigator.share({ title: 'القرآن الكريم', text: shareText }).catch(() => {});
                        } else {
                            navigator.clipboard.writeText(shareText);
                            showToast("لنک کلپ بورڈ پر کاپی ہو گیا!");
                        }
                    };
                    actionRow.appendChild(shareBtn);

                    card.appendChild(actionRow);
                    container.appendChild(card);
                });

            } catch (err) {
                loader.innerHTML = '<p class="text-red-500 urdu-text">سورۃ لوڈ نہیں ہو سکی۔</p>';
            }
        }

        document.getElementById('surahSelect').addEventListener('change', (e) => loadSurah(e.target.value));
        document.getElementById('themeToggleBtn').addEventListener('click', () => document.documentElement.classList.toggle('dark'));
        
        document.getElementById('adminBtn').addEventListener('click', () => {
            document.getElementById('adminAuthModal').classList.remove('hidden');
        });
        document.getElementById('adminLoginClose').addEventListener('click', () => {
            document.getElementById('adminAuthModal').classList.add('hidden');
        });
        document.getElementById('closeTafseerBtn').addEventListener('click', () => {
            document.getElementById('tafseerModal').classList.add('hidden');
        });
        document.getElementById('adminPanelClose').addEventListener('click', () => {
            document.getElementById('adminPanelModal').classList.add('hidden');
        });

        document.getElementById('adminLoginSubmit').addEventListener('click', () => {
            const pass = document.getElementById('adminPasswordInput').value;
            if (pass === "quran123") {
                document.getElementById('adminAuthModal').classList.add('hidden');
                document.getElementById('adminPanelModal').classList.remove('hidden');
                document.getElementById('adminPasswordInput').value = '';
            } else {
                alert("غلط پاس ورڈ!");
            }
        });

        // Single Ayah Publish Listener
        document.getElementById('adminPublishBtn').addEventListener('click', () => {
            const sNum = document.getElementById('adminSurahSelect').value;
            const aNum = document.getElementById('adminAyahNum').value;
            const trans = document.getElementById('adminTranslationText').value.trim();
            const tafs = document.getElementById('adminTafseerText').value.trim();

            let storageKey = `surah_${sNum}_data`;
            let surahData = JSON.parse(localStorage.getItem(storageKey) || '{}');

            if (!surahData[aNum]) surahData[aNum] = {};
            if (trans) surahData[aNum].translation = trans;
            if (tafs) surahData[aNum].tafseer = tafs;

            localStorage.setItem(storageKey, JSON.stringify(surahData));

            showToast("آیت کا ڈیٹا کامیابی سے محفوظ ہو گیا!");
            document.getElementById('adminPanelModal').classList.add('hidden');
            
            if (document.getElementById('surahSelect').value === sNum) {
                loadSurah(sNum);
            }
        });

        // Bulk JSON Save Listener
        document.getElementById('adminBulkSaveBtn').addEventListener('click', () => {
            const sNum = document.getElementById('adminSurahSelect').value;
            const rawJson = document.getElementById('adminBulkJsonInput').value.trim();

            if (!rawJson) {
                alert("Pehle JSON data enter karein!");
                return;
            }

            try {
                const parsedData = JSON.parse(rawJson);
                let storageKey = `surah_${sNum}_data`;
                
                // Existing data ke sath merge karke store karna
                let existingData = JSON.parse(localStorage.getItem(storageKey) || '{}');
                let mergedData = { ...existingData, ...parsedData };

                localStorage.setItem(storageKey, JSON.stringify(mergedData));

                showToast(`سورۃ #${sNum} کا مکمل ڈیٹا کامیابی سے محفوظ ہو گیا!`);
                document.getElementById('adminPanelModal').classList.add('hidden');
                document.getElementById('adminBulkJsonInput').value = '';

                if (document.getElementById('surahSelect').value === sNum) {
                    loadSurah(sNum);
                }
            } catch (err) {
                alert("JSON Format mein galti hai! Kripya format check karein.");
            }
        });

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMsg').innerText = msg;
            toast.classList.remove('opacity-0', 'pointer-events-none');
            setTimeout(() => toast.classList.add('opacity-0', 'pointer-events-none'), 3000);
        }

        window.onload = initApp;
    </script>
</body>
</html>
