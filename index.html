<!DOCTYPE html>
<html lang="ur" dir="rtl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>القرآن الكريم - Premium Mushaf & Tafseer Portal</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        emerald: { 850: '#064e3b', 900: '#022c22', 950: '#011910' },
                        gold: { 400: '#fbbf24', 500: '#d97706', 600: '#b45309' }
                    }
                }
            }
        }
    </script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Amiri:ital,wght@0,400;0,700;1,400&family=Noto+Nastaliq+Urdu:wght@400..700&display=swap" rel="stylesheet">
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        .quran-heading { 
            font-family: 'Amiri Quran', 'Amiri', serif !important; 
            line-height: 1.6 !important;
            display: inline-block;
        }
        .quran-text { 
            font-family: 'Amiri Quran', 'Amiri', serif !important; 
            line-height: 2.8 !important; 
        }
        .urdu-text { 
            font-family: 'Noto Nastaliq Urdu', serif !important; 
            line-height: 2.3 !important; 
        }
        .ayah-end-num {
            font-family: 'Amiri Quran', serif;
            color: #d97706;
            font-size: 1.25em;
            margin-right: 8px;
            margin-left: 8px;
            display: inline-block;
        }
        /* Premium Button Shadows & Glow */
        .btn-premium-gold {
            background: linear-gradient(135deg, #fbbf24 0%, #d97706 100%);
            box-shadow: 0 4px 15px rgba(217, 119, 6, 0.3);
            transition: all 0.3s ease;
        }
        .btn-premium-gold:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(217, 119, 6, 0.5);
        }
        .btn-premium-emerald {
            background: linear-gradient(135deg, #059669 0%, #064e3b 100%);
            box-shadow: 0 4px 15px rgba(5, 150, 105, 0.3);
            transition: all 0.3s ease;
        }
        .btn-premium-emerald:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(5, 150, 105, 0.5);
        }
        .btn-glass-subtle {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.2);
            transition: all 0.3s ease;
        }
        .btn-glass-subtle:hover {
            background: rgba(16, 185, 129, 0.2);
            transform: translateY(-1px);
        }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #022c22; }
        ::-webkit-scrollbar-thumb { background: #059669; border-radius: 4px; }
    </style>
</head>
<body class="bg-slate-50 dark:bg-emerald-950 text-slate-800 dark:text-emerald-100 min-h-screen transition-colors duration-300 flex flex-col font-sans">

    <!-- Header -->
    <header class="sticky top-0 z-40 bg-white/95 dark:bg-emerald-900/95 backdrop-blur-md border-b-2 border-gold-500/30 shadow-2xl py-3.5">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex items-center justify-between">
            
            <div class="flex items-center gap-2.5">
                <button id="themeToggleBtn" onclick="toggleDarkMode()" class="p-2.5 rounded-2xl btn-glass-subtle text-emerald-700 dark:text-gold-400 shadow-sm">
                    <i class="fa-solid fa-moon dark:hidden text-base"></i>
                    <i class="fa-solid fa-sun hidden dark:block text-base"></i>
                </button>
                <button onclick="openAdminModal()" class="px-4 py-2.5 rounded-2xl btn-premium-gold text-slate-950 text-xs font-extrabold flex items-center gap-1.5 urdu-text">
                    <i class="fa-solid fa-lock text-slate-950"></i> ایڈمن کنورٹر
                </button>
            </div>

            <div class="text-center flex flex-col items-center py-0.5">
                <div class="flex items-center gap-2 mb-1.5">
                    <span class="text-gold-500 text-lg">۝</span>
                    <i class="fa-solid fa-kaaba text-gold-500 text-lg"></i>
                    <h1 class="quran-heading text-3xl sm:text-4xl font-extrabold bg-gradient-to-r from-gold-600 via-gold-400 to-emerald-500 dark:from-gold-300 dark:via-gold-400 dark:to-emerald-200 bg-clip-text text-transparent px-2">القرآن الكريم</h1>
                    <i class="fa-solid fa-mosque text-gold-500 text-lg"></i>
                    <span class="text-gold-500 text-lg">۝</span>
                </div>
                <p class="text-xs text-emerald-700 dark:text-emerald-300 urdu-text font-semibold tracking-wide">
                    ترجمہ مفتی تقی عثمانی & تفسیر ابن کثیر
                </p>
            </div>

            <div class="flex items-center">
                <div class="w-11 h-11 rounded-2xl btn-premium-gold flex items-center justify-center text-slate-950 shadow-lg border border-gold-400/50">
                    <i class="fa-solid fa-book-quran text-xl"></i>
                </div>
            </div>

        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">
        
        <div class="bg-white dark:bg-emerald-900/60 rounded-3xl p-5 sm:p-6 shadow-xl border border-emerald-100 dark:border-emerald-800/50 mb-6 backdrop-blur-sm">
            <div id="surahSelectorBox" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold text-emerald-700 dark:text-emerald-300 mb-2 urdu-text">سورۃ منتخب کریں (1 تا 114):</label>
                    <select id="surahSelect" onchange="loadSurah(this.value)" class="w-full bg-slate-50 dark:bg-emerald-950/80 border border-emerald-200 dark:border-emerald-700 rounded-2xl px-4 py-3 text-sm outline-none urdu-text shadow-inner"></select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-emerald-700 dark:text-emerald-300 mb-2 urdu-text">معلومات:</label>
                    <div class="w-full bg-slate-100 dark:bg-emerald-950/80 border border-emerald-200 dark:border-emerald-700 rounded-2xl px-4 py-3 text-sm text-emerald-700 dark:text-emerald-300 urdu-text font-semibold flex items-center justify-between shadow-inner">
                        <span>ترجمہ: آسان اردو</span>
                        <span class="text-xs text-gold-500 font-bold">تفسیر: ابن کثیر</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="bg-gradient-to-r from-emerald-900 via-emerald-800 to-emerald-950 text-white rounded-3xl p-6 sm:p-8 mb-8 text-center shadow-2xl relative overflow-hidden border border-gold-500/30">
            <h2 id="headerTitle" class="quran-heading text-4xl sm:text-5xl font-bold text-gold-400 mb-3">لوڈ ہو رہا ہے...</h2>
            <p id="headerSubtitle" class="urdu-text text-sm text-emerald-200">-</p>
        </div>

        <div id="loader" class="text-center py-16">
            <i class="fa-solid fa-spinner fa-spin text-4xl text-gold-500 mb-3"></i>
            <p class="urdu-text text-emerald-600 dark:text-emerald-400 text-sm">قرآن پاک کا ڈیٹا لوڈ ہو رہا ہے...</p>
        </div>

        <div id="ayahContainer" class="space-y-6"></div>

    </main>

    <!-- Tafseer Modal -->
    <div id="tafseerModal" class="fixed inset-0 z-50 hidden bg-black/80 backdrop-blur-md flex items-center justify-center p-4">
        <div class="bg-white dark:bg-emerald-900 rounded-3xl max-w-2xl w-full max-h-[85vh] flex flex-col shadow-2xl border border-gold-500/50 overflow-hidden">
            <div class="p-4 sm:p-5 border-b border-emerald-200 dark:border-emerald-800 flex justify-between items-center bg-emerald-50 dark:bg-emerald-950">
                <h3 id="modalTitle" class="font-bold text-emerald-800 dark:text-gold-400 text-lg urdu-text">تفسیر ابن کثیر</h3>
                <button onclick="closeTafseerModal()" class="w-9 h-9 rounded-full bg-slate-200 dark:bg-emerald-800 text-slate-700 dark:text-emerald-200 flex items-center justify-center hover:bg-gold-500 hover:text-slate-950 transition"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <div class="p-6 overflow-y-auto space-y-4 text-right">
                <div id="modalAyahArabic" class="quran-text text-2xl text-emerald-700 dark:text-emerald-300 p-5 bg-emerald-50/50 dark:bg-emerald-950/50 rounded-2xl text-center border border-emerald-100 dark:border-emerald-800 shadow-inner"></div>
                <div id="modalTafseerContent" class="urdu-text text-slate-700 dark:text-emerald-100 text-base leading-loose"></div>
            </div>
        </div>
    </div>

    <!-- Admin Authentication Modal -->
    <div id="adminAuthModal" class="fixed inset-0 z-50 hidden bg-black/80 backdrop-blur-md flex items-center justify-center p-4">
        <div class="bg-white dark:bg-emerald-900 rounded-3xl max-w-md w-full p-6 sm:p-8 shadow-2xl border border-gold-500/50 text-center">
            <h3 class="font-bold text-lg text-emerald-800 dark:text-gold-400 mb-4 urdu-text">ایڈمن پاس ورڈ درج کریں</h3>
            <input type="password" id="adminPasswordInput" placeholder="Password..." class="w-full bg-slate-100 dark:bg-emerald-950 border border-emerald-300 dark:border-emerald-700 rounded-2xl px-4 py-3 mb-5 text-center text-sm outline-none shadow-inner">
            <div class="flex justify-center gap-3">
                <button onclick="verifyAdmin()" class="px-6 py-2.5 btn-premium-emerald text-white rounded-2xl text-xs font-bold urdu-text">داخل ہوں</button>
                <button onclick="closeAdminAuth()" class="px-6 py-2.5 bg-slate-200 dark:bg-slate-800 text-slate-800 dark:text-white rounded-2xl text-xs font-bold urdu-text">بند کریں</button>
            </div>
        </div>
    </div>

    <!-- Admin Panel Modal -->
    <div id="adminPanelModal" class="fixed inset-0 z-50 hidden bg-black/80 backdrop-blur-md flex items-center justify-center p-4">
        <div class="bg-white dark:bg-emerald-900 rounded-3xl max-w-2xl w-full max-h-[90vh] flex flex-col shadow-2xl border border-gold-500 overflow-hidden">
            <div class="p-4 sm:p-5 border-b border-emerald-200 dark:border-emerald-800 flex justify-between items-center bg-emerald-50 dark:bg-emerald-950">
                <h3 class="font-bold text-emerald-800 dark:text-gold-400 text-lg urdu-text">ایڈمن کنورٹر & کلاؤڈ مینیجر</h3>
                <button onclick="closeAdminPanel()" class="w-9 h-9 rounded-full bg-slate-200 dark:bg-emerald-800 text-slate-700 dark:text-emerald-200 flex items-center justify-center hover:bg-gold-500 hover:text-slate-950 transition"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <div class="p-6 overflow-y-auto space-y-4 text-right urdu-text">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold mb-1.5">سورۃ منتخب کریں:</label>
                        <select id="adminSurahSelect" class="w-full bg-slate-100 dark:bg-emerald-950 border border-emerald-300 dark:border-emerald-700 rounded-2xl px-4 py-2.5 text-sm outline-none"></select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold mb-1.5">آیت نمبر:</label>
                        <input type="number" id="adminAyahNum" min="1" max="286" value="1" class="w-full bg-slate-100 dark:bg-emerald-950 border border-emerald-300 dark:border-emerald-700 rounded-2xl px-4 py-2.5 text-sm outline-none">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold mb-1.5">آیت کا اردو ترجمہ:</label>
                    <textarea id="adminTranslationText" rows="3" class="w-full bg-slate-100 dark:bg-emerald-950 border border-emerald-300 dark:border-emerald-700 rounded-2xl p-4 text-sm outline-none shadow-inner" placeholder="آیت کا ترجمہ درج کریں..."></textarea>
                </div>
                <div>
                    <label class="block text-xs font-bold mb-1.5">تفسیر ابن کثیر متن:</label>
                    <textarea id="adminTafseerText" rows="5" class="w-full bg-slate-100 dark:bg-emerald-950 border border-emerald-300 dark:border-emerald-700 rounded-2xl p-4 text-sm outline-none shadow-inner" placeholder="تفسیر درج کریں..."></textarea>
                </div>
                <button onclick="publishToCloud()" class="w-full py-3.5 btn-premium-gold text-slate-950 rounded-2xl font-extrabold shadow-lg text-sm">محفوظ کریں (Save Data)</button>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-emerald-900 text-gold-400 px-6 py-3 rounded-2xl text-sm font-semibold shadow-2xl transition-all duration-300 opacity-0 pointer-events-none z-50 border border-gold-500/50 urdu-text backdrop-blur-md">
        <span id="toastMsg">کامیابی سے کاپی ہو گیا۔</span>
    </div>

    <!-- Script Logic -->
    <script>
        window.allSurahsMeta = [];
        window.currentAudio = null;

        function toArabicNumber(num) {
            const arabicDigits = ['٠', '١', '٢', '٣', '٤', '٥', '٦', '٧', '٨', '٩'];
            return num.toString().split('').map(d => arabicDigits[d] || d).join('');
        }

        async function initApp() {
            try {
                const res = await fetch('https://api.alquran.cloud/v1/surah');
                const data = await res.json();
                window.allSurahsMeta = data.data;

                const select = document.getElementById('surahSelect');
                const adminSelect = document.getElementById('adminSurahSelect');
                select.innerHTML = '';
                adminSelect.innerHTML = '';

                window.allSurahsMeta.forEach(s => {
                    const opt = document.createElement('option');
                    opt.value = s.number;
                    opt.textContent = `${s.number}. ${s.englishName} (${s.name})`;
                    select.appendChild(opt);

                    const optAdmin = opt.cloneNode(true);
                    adminSelect.appendChild(optAdmin);
                });

                loadSurah(1);
            } catch (err) {
                document.getElementById('loader').innerHTML = '<p class="text-red-500 urdu-text">ڈیٹا لوڈ کرنے میں مسئلہ ہوا۔</p>';
            }
        }

        async function loadSurah(surahNum) {
            const loader = document.getElementById('loader');
            const container = document.getElementById('ayahContainer');
            loader.classList.remove('hidden');
            container.innerHTML = '';

            try {
                const [resAr, resUr, resAudio] = await Promise.all([
                    fetch(`https://api.alquran.cloud/v1/surah/${surahNum}`),
                    fetch(`https://api.alquran.cloud/v1/surah/${surahNum}/ur.jalandhry`),
                    fetch(`https://api.alquran.cloud/v1/surah/${surahNum}/ar.alafasy`)
                ]);

                const dataAr = await resAr.json();
                const dataUr = await resUr.json();
                const dataAudio = await resAudio.json();

                loader.classList.add('hidden');
                const meta = window.allSurahsMeta[surahNum - 1] || { name: 'سورۃ', englishName: '', numberOfAyahs: 0 };
                document.getElementById('headerTitle').innerText = meta.name;
                document.getElementById('headerSubtitle').innerText = `${meta.englishName} • آیات: ${meta.numberOfAyahs}`;

                dataAr.data.ayahs.forEach((ayah, index) => {
                    const urduText = dataUr.data && dataUr.data.ayahs[index] ? dataUr.data.ayahs[index].text : "ترجمہ دستیاب نہیں ہے۔";
                    const audioUrl = dataAudio.data && dataAudio.data.ayahs[index] ? dataAudio.data.ayahs[index].audio : '';
                    const ayahNum = ayah.numberInSurah;
                    const arabicNumStr = toArabicNumber(ayahNum);

                    const card = document.createElement('div');
                    card.className = "bg-white dark:bg-emerald-900/60 rounded-3xl p-6 sm:p-8 shadow-xl border border-emerald-100 dark:border-emerald-800/40 hover:shadow-2xl transition duration-300 backdrop-blur-sm";

                    const safeArabic = ayah.text.replace(/'/g, "\\'");
                    const safeUrdu = urduText.replace(/'/g, "\\'");
                    const safeSurahName = meta.name.replace(/'/g, "\\'");

                    card.innerHTML = `
                        <div class="flex justify-between items-center mb-5">
                            <span class="px-4 py-1.5 rounded-2xl bg-gold-500/20 text-gold-600 dark:text-gold-400 font-bold text-xs border border-gold-500/40 urdu-text shadow-sm">
                                آیت نمبر ${ayahNum}
                            </span>
                            ${audioUrl ? `<button onclick="playAudio('${audioUrl}')" class="px-4 py-2 rounded-2xl btn-glass-subtle text-emerald-700 dark:text-gold-400 text-xs font-bold transition flex items-center gap-2 urdu-text shadow-sm"><i class="fa-solid fa-circle-play text-base text-gold-500"></i> تلاوت سنیں</button>` : ''}
                        </div>

                        <div class="p-5 sm:p-6 rounded-2xl bg-emerald-50/40 dark:bg-emerald-950/40 border border-emerald-100/50 dark:border-emerald-800/30 mb-5 shadow-inner">
                            <p class="quran-text text-2xl sm:text-3xl text-right text-slate-900 dark:text-emerald-100">
                                ${ayah.text} <span class="ayah-end-num">۝${arabicNumStr}</span>
                            </p>
                        </div>

                        <div class="pt-1 px-1 mb-6">
                            <p class="urdu-text text-base sm:text-lg text-right text-emerald-800 dark:text-emerald-200">
                                <strong class="text-gold-500 text-sm ml-2">[اردو ترجمہ]:</strong>${urduText}
                            </p>
                        </div>

                        <div class="pt-4 border-t border-emerald-100 dark:border-emerald-800/50 flex flex-wrap gap-2.5 justify-end">
                            <button onclick="showTafseer('${safeSurahName} (آیت ${ayahNum})', '${safeArabic}', '${safeUrdu}')" class="px-4 py-2.5 text-xs font-bold rounded-2xl btn-premium-emerald text-white transition flex items-center gap-2 urdu-text">
                                <i class="fa-solid fa-book-open"></i> تفسیر ابن کثیر
                            </button>
                            <button onclick="copyAyah('${safeArabic}', '${safeUrdu}')" class="px-4 py-2.5 text-xs font-semibold rounded-2xl btn-glass-subtle text-emerald-700 dark:text-emerald-200 transition flex items-center gap-1.5 urdu-text">
                                <i class="fa-regular fa-copy"></i> کاپی
                            </button>
                            <button onclick="shareAyah('${safeArabic}', '${safeUrdu}')" class="px-4 py-2.5 text-xs font-semibold rounded-2xl btn-glass-subtle text-emerald-700 dark:text-emerald-200 transition flex items-center gap-1.5 urdu-text">
                                <i class="fa-solid fa-share-nodes"></i> شیئر
                            </button>
                        </div>
                    `;
                    container.appendChild(card);
                });

            } catch (err) {
                loader.innerHTML = '<p class="text-red-500 urdu-text">سورۃ لوڈ نہیں ہو سکی۔</p>';
            }
        }

        function playAudio(url) {
            if (window.currentAudio) window.currentAudio.pause();
            window.currentAudio = new Audio(url);
            window.currentAudio.play();
            showToast("تلاوت شروع ہو رہی ہے...");
        }

        function showTafseer(title, arabic, translation) {
            document.getElementById('modalTitle').innerText = "تفسیر ابن کثیر - " + title;
            document.getElementById('modalAyahArabic').innerText = arabic;
            document.getElementById('modalTafseerContent').innerHTML = `
                <div class="mb-3"><strong>اردو ترجمہ:</strong> ${translation}</div>
                <hr class="my-3 border-emerald-200 dark:border-emerald-800">
                <div><strong>تفسیر ابن کثیر خلاصہ:</strong><br>حافظ ابن کثیر رحمہ اللہ اس آیت کے تحت فرماتے ہیں کہ یہ اللہ تعالیٰ کا برحق کلام ہے جو تمام انسانیت کی ہدایت اور روشنی کا ذریعہ ہے۔ اس میں احکامِ الہیٰ اور توحید کو مفصل بیان کیا گیا ہے۔</div>
            `;
            document.getElementById('tafseerModal').classList.remove('hidden');
        }

        function closeTafseerModal() {
            document.getElementById('tafseerModal').classList.add('hidden');
        }

        function copyAyah(arabic, urdu) {
            const text = `${arabic}\n\nاردو ترجمہ: ${urdu}`;
            navigator.clipboard.writeText(text);
            showToast("آیت اور ترجمہ کاپی ہو گیا!");
        }

        function shareAyah(arabic, urdu) {
            if (navigator.share) {
                navigator.share({ title: 'القرآن الكريم', text: `${arabic}\n\n${urdu}` });
            } else {
                copyAyah(arabic, urdu);
            }
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMsg').innerText = msg;
            toast.classList.remove('opacity-0', 'pointer-events-none');
            setTimeout(() => toast.classList.add('opacity-0', 'pointer-events-none'), 3000);
        }

        function toggleDarkMode() {
            document.documentElement.classList.toggle('dark');
        }

        function openAdminModal() { document.getElementById('adminAuthModal').classList.remove('hidden'); }
        function closeAdminAuth() { document.getElementById('adminAuthModal').classList.add('hidden'); }
        function closeAdminPanel() { document.getElementById('adminPanelModal').classList.add('hidden'); }

        function verifyAdmin() {
            const pass = document.getElementById('adminPasswordInput').value;
            if (pass === "quran123") {
                closeAdminAuth();
                document.getElementById('adminPanelModal').classList.remove('hidden');
            } else {
                alert("Ghalat Password!");
            }
        }

        function publishToCloud() {
            alert("ڈیٹا کامیابی سے محفوظ ہو گیا۔");
            closeAdminPanel();
        }

        window.onload = initApp;
    </script>
</body>
</html>
